<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>im-stock OPEN Event</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:'Pretendard',sans-serif;
 background:#0f1115;
 color:#fff;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:80px 24px;
}

/* 헤더 */
.logo{
 font-size:28px;
 font-weight:800;
}
.logo span{
 color:#ff3b3b;
}

/* 히어로 */
.hero{
 display:grid;
 grid-template-columns:1.1fr 0.9fr;
 gap:60px;
 align-items:center;
}

.hero h1{
 font-size:56px;
 font-weight:800;
 margin-bottom:20px;
}

.hero p{
 color:#b8bcc8;
 font-size:20px;
}

.highlight{
 color:#ff3b3b;
}

/* 버튼 */
.cta{
 margin-top:30px;
}
.cta button{
 padding:16px 32px;
 border:none;
 border-radius:10px;
 font-size:18px;
 font-weight:700;
 cursor:pointer;
}
.primary{
 background:#ff3b3b;
 color:#fff;
}

/* 카드 */
.heroCard{
 background:#161a22;
 padding:40px;
 border-radius:16px;
 border:1px solid rgba(255,255,255,0.05);
}
.discount{
 font-size:64px;
 font-weight:800;
 color:#ff3b3b;
}

/* 섹션 */
.section{
 margin-top:120px;
}
.sectionTitle{
 font-size:36px;
 font-weight:800;
 text-align:center;
 margin-bottom:50px;
}

/* 카드 그리드 */
.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:24px;
}

.card{
 background:#161a22;
 padding:30px;
 border-radius:14px;
 border:1px solid rgba(255,255,255,0.05);
 transition:0.2s;
}
.card:hover{
 transform:translateY(-5px);
}

.card h3{
 margin-top:0;
}
.card p{
 color:#9aa1b2;
}

/* 숫자 */
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
 text-align:center;
}
.stat{
 background:#161a22;
 padding:30px;
 border-radius:14px;
}
.statNumber{
 font-size:40px;
 font-weight:800;
 color:#ff3b3b;
}

/* 미리보기 */
.previewGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
}

.previewItem{
 position:relative;
 height:180px;
 border-radius:12px;
 overflow:hidden;
 background:#1a1f29;
}

.previewItem video{
 position:absolute;
 width:100%;
 height:100%;
 object-fit:cover;
 opacity:0;
 transition:0.2s;
}

.previewItem:hover video{
 opacity:1;
}

/* 가격 */
.pricing{
 background:#161a22;
 padding:50px;
 border-radius:16px;
 text-align:center;
}
.price{
 font-size:60px;
 color:#ff3b3b;
 font-weight:800;
}

/* 반응형 */
@media(max-width:900px){
 .hero{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr}
 .previewGrid{grid-template-columns:1fr}
}

.logo{
  display:flex;
  align-items:flex-start;
  margin-bottom:40px;
}

.logo img{
  height:60px;
}
 
<style>
.previewGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3열로 나누기 */
    gap: 20px;                             /* 박스 사이 간격 */
    margin: 40px auto;                     /* 위아래 여백 */
    max-width: 1000px;                     /* 전체 최대 너비 */
}

.previewItem {
    background-color: #1a1d23;  /* 짙은 배경색 */
    border: 1px solid #2d3748;  /* 얇은 테두리 */
    border-radius: 16px;        /* 둥근 모서리 */
    aspect-ratio: 16 / 9;       /* 16:9 비율 유지 */
    overflow: hidden;           /* 영상이 삐져나가지 않게 */
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4a5568;             /* 'Video' 텍스트 색상 */
}

.previewItem video {
    width: 100%;
    height: 100%;
    object-fit: cover;          /* 박스에 꽉 차게 채움 */

 @media (max-width: 900px) {
    .previewGrid {
        grid-template-columns: 1fr;
    }
}

.event-banner {
    border: 1px solid #4a5568; /* 얇은 회색 테두리 */
    border-radius: 20px;       /* 둥근 모서리 */
    padding: 60px 20px;        /* 안쪽 여백 */
    text-align: center;        /* 중앙 정렬 */
    margin: 40px auto;         /* 위아래 간격 */
    max-width: 1000px;         /* 최대 너비 */
}

.event-subtitle {
    color: white;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

.event-title {
    color: #ff4d4d;            /* 빨간색 포인트 컬러 */
    font-size: 80px;           /* 크게 강조 */
    font-weight: 900;
    margin: 10px 0;
}

.event-notice {
    color: #94a3b8;            /* 흐린 회색 텍스트 */
    font-size: 14px;
    margin-bottom: 30px;
}

/* 하단 버튼 디자인 */
.event-button {
    background-color: #ff4d4d; /* 버튼 배경색 */
    color: white;
    border: none;
    padding: 18px 45px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;       /* 버튼 모서리 */
    cursor: pointer;
    transition: transform 0.2s;
}

.event-button:hover {
    transform: scale(1.05);    /* 마우스 올렸을 때 살짝 커짐 */
}
 
</style>

      <div style="text-align: left;">

</body>
</html>
