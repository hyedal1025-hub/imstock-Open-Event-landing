<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:'Pretendard',sans-serif;
 background:#0f1115;
 color:#fff;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:80px 24px;
}

/* 헤더 */
.logo{
 font-size:28px;
 font-weight:800;
}
.logo span{
 color:#ff3b3b;
}

/* 히어로 */
.hero{
 display:grid;
 grid-template-columns:1.1fr 0.9fr;
 gap:60px;
 align-items:center;
}

.hero h1{
 font-size:56px;
 font-weight:800;
 margin-bottom:20px;
}

.hero p{
 color:#b8bcc8;
 font-size:20px;
}

.highlight{
 color:#ff3b3b;
}

/* 버튼 */
.cta{
 margin-top:30px;
}
.cta button{
 padding:16px 32px;
 border:none;
 border-radius:10px;
 font-size:18px;
 font-weight:700;
 cursor:pointer;
}
.primary{
 background:#ff3b3b;
 color:#fff;
}

/* 카드 */
.heroCard{
 background:#161a22;
 padding:40px;
 border-radius:16px;
 border:1px solid rgba(255,255,255,0.05);
}
.discount{
 font-size:64px;
 font-weight:800;
 color:#ff3b3b;
}

/* 섹션 */
.section{
 margin-top:100px;
}
.sectionTitle{
 font-size:36px;
 font-weight:800;
 text-align:center;
 margin-bottom:80px;
}

/* 카드 그리드 */
.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:24px;
}

.card{
 background:#161a22;
 padding:30px;
 border-radius:14px;
 border:1px solid rgba(255,255,255,0.05);
 transition:0.2s;
}
.card:hover{
 transform:translateY(-5px);
}

.card h3{
 margin-top:0;
}
.card p{
 color:#9aa1b2;
}

/* 숫자 */
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
 text-align:center;
}
.stat{
 background:#161a22;
 padding:30px;
 border-radius:14px;
}
.statNumber{
 font-size:40px;
 font-weight:800;
 color:#ff3b3b;
}

/* 미리보기 */
.previewGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
}

.previewItem {
    width: 320px !important;
    height: 180px !important;
    flex-shrink: 0 !important;
    overflow: hidden;
    border-radius: 12px;
    background: #000; /* 영상 로딩 전 배경 */
    cursor: pointer;
    position: relative;
}

.previewItem video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background-size: cover;
    background-position: center;
}

.previewItem:hover video{
 opacity:1;
}

/* 가격 */
.pricing{
 background:#161a22;
 padding:50px;
 border-radius:16px;
 text-align:center;
}
.price{
 font-size:60px;
 color:#ff3b3b;
 font-weight:800;
}

/* 반응형 */
@media(max-width:900px){
 .hero{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr}
 .previewGrid{grid-template-columns:1fr}
}

.logo{
  display:flex;
  align-items:flex-start;
  margin-bottom:40px;
}

.logo img{
  height:60px;
}
 

 
</style>
