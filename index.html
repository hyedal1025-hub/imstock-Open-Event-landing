<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>im-stock OPEN Event</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:'Pretendard',sans-serif;
 background:#0f1115;
 color:#fff;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:80px 24px;
}

/* 헤더 */
.logo{
 font-size:28px;
 font-weight:800;
}
.logo span{
 color:#ff3b3b;
}

/* 히어로 */
.hero{
 display:grid;
 grid-template-columns:1.1fr 0.9fr;
 gap:60px;
 align-items:center;
}

.hero h1{
 font-size:56px;
 font-weight:800;
 margin-bottom:20px;
}

.hero p{
 color:#b8bcc8;
 font-size:20px;
}

.highlight{
 color:#ff3b3b;
}

/* 버튼 */
.cta{
 margin-top:30px;
}
.cta button{
 padding:16px 32px;
 border:none;
 border-radius:10px;
 font-size:18px;
 font-weight:700;
 cursor:pointer;
}
.primary{
 background:#ff3b3b;
 color:#fff;
}

/* 카드 */
.heroCard{
 background:#161a22;
 padding:40px;
 border-radius:16px;
 border:1px solid rgba(255,255,255,0.05);
}
.discount{
 font-size:64px;
 font-weight:800;
 color:#ff3b3b;
}

/* 섹션 */
.section{
 margin-top:120px;
}
.sectionTitle{
 font-size:36px;
 font-weight:800;
 text-align:center;
 margin-bottom:50px;
}

/* 카드 그리드 */
.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:24px;
}

.card{
 background:#161a22;
 padding:30px;
 border-radius:14px;
 border:1px solid rgba(255,255,255,0.05);
 transition:0.2s;
}
.card:hover{
 transform:translateY(-5px);
}

.card h3{
 margin-top:0;
}
.card p{
 color:#9aa1b2;
}

/* 숫자 */
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
 text-align:center;
}
.stat{
 background:#161a22;
 padding:30px;
 border-radius:14px;
}
.statNumber{
 font-size:40px;
 font-weight:800;
 color:#ff3b3b;
}

/* 미리보기 */
.previewGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
}

.previewItem{
 position:relative;
 height:180px;
 border-radius:12px;
 overflow:hidden;
 background:#1a1f29;
}

.previewItem video{
 position:absolute;
 width:100%;
 height:100%;
 object-fit:cover;
 opacity:0;
 transition:0.2s;
}

.previewItem:hover video{
 opacity:1;
}

/* 가격 */
.pricing{
 background:#161a22;
 padding:50px;
 border-radius:16px;
 text-align:center;
}
.price{
 font-size:60px;
 color:#ff3b3b;
 font-weight:800;
}

/* 반응형 */
@media(max-width:900px){
 .hero{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr}
 .previewGrid{grid-template-columns:1fr}
}

<.logo{
  display:flex;
  align-items:flex-start;
  margin-bottom:40px;
}

.logo img{
  height:100px;
}/style>


<div class="container">

<div class="logo">
  <img src="logo.png" alt="im-stock 로고">
</div>

<section class="hero">
<div>
<h1>
im-stock <span class="highlight">OPEN EVENT</span><br>
최대 50% 평생 할인
</h1>

<p>
오늘의 할인가가 평생 구독료가 됩니다.<br>
Price Lock으로 할인 유지
</p>

<div class="cta">
<button class="primary">지금 구독 시작</button>
</div>
</div>

<div class="heroCard">
<div class="discount">50%</div>
<p>이벤트 기간 한정</p>
</div>
</section>

<section class="section">
<div class="sectionTitle">콘텐츠 규모</div>

<div class="stats">
<div class="stat">
<div class="statNumber">30,000+</div>
<p>이미지</p>
</div>

<div class="stat">
<div class="statNumber">12,000+</div>
<p>영상</p>
</div>

<div class="stat">
<div class="statNumber">50+</div>
<p>지역</p>
</div>
</div>
</section>

<section class="section">
<div class="sectionTitle">콘텐츠 미리보기</div>

<div class="previewGrid">

<div class="previewItem">
<video muted loop>
<source src="preview1.mp4">
</video>
</div>

<div class="previewItem">
<video muted loop>
<source src="preview2.mp4">
</video>
</div>

<div class="previewItem">
<video muted loop>
<source src="preview3.mp4">
</video>
</div>

</div>
</section>

<section class="section">
<div class="sectionTitle">왜 im-stock인가?</div>

<div class="grid">

<div class="card">
<h3>정직한 가격</h3>
<p>데이터 기반 가격 정책</p>
</div>

<div class="card">
<h3>마케팅 자산</h3>
<p>1년 콘텐츠 확보</p>
</div>

<div class="card">
<h3>Full License</h3>
<p>상업적 이용 가능</p>
</div>

</div>
</section>

<section class="section">
<div class="pricing">
<h2>연간 구독</h2>
<div class="price">50% OFF</div>
<button class="primary">지금 시작</button>
</div>
</section>

</div>

</body>
</html>
