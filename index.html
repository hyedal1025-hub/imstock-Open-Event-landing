<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>im-stock OPEN Event</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:'Pretendard',sans-serif;
 background:#0f1115;
 color:#fff;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:80px 24px;
}

/* 헤더 */
.logo{
 font-size:28px;
 font-weight:800;
}
.logo span{
 color:#ff3b3b;
}

/* 히어로 */
.hero{
 display:grid;
 grid-template-columns:1.1fr 0.9fr;
 gap:60px;
 align-items:center;
}

.hero h1{
 font-size:56px;
 font-weight:800;
 margin-bottom:20px;
}

.hero p{
 color:#b8bcc8;
 font-size:20px;
}

.highlight{
 color:#ff3b3b;
}

/* 버튼 */
.cta{
 margin-top:30px;
}
.cta button{
 padding:16px 32px;
 border:none;
 border-radius:10px;
 font-size:18px;
 font-weight:700;
 cursor:pointer;
}
.primary{
 background:#ff3b3b;
 color:#fff;
}

/* 카드 */
.heroCard{
 background:#161a22;
 padding:40px;
 border-radius:16px;
 border:1px solid rgba(255,255,255,0.05);
}
.discount{
 font-size:64px;
 font-weight:800;
 color:#ff3b3b;
}

/* 섹션 */
.section{
 margin-top:120px;
}
.sectionTitle{
 font-size:36px;
 font-weight:800;
 text-align:center;
 margin-bottom:50px;
}

/* 카드 그리드 */
.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:24px;
}

.card{
 background:#161a22;
 padding:30px;
 border-radius:14px;
 border:1px solid rgba(255,255,255,0.05);
 transition:0.2s;
}
.card:hover{
 transform:translateY(-5px);
}

.card h3{
 margin-top:0;
}
.card p{
 color:#9aa1b2;
}

/* 숫자 */
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
 text-align:center;
}
.stat{
 background:#161a22;
 padding:30px;
 border-radius:14px;
}
.statNumber{
 font-size:40px;
 font-weight:800;
 color:#ff3b3b;
}

/* 미리보기 */
.previewGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
}

.previewItem{
 position:relative;
 height:180px;
 border-radius:12px;
 overflow:hidden;
 background:#1a1f29;
}

.previewItem video{
 position:absolute;
 width:100%;
 height:100%;
 object-fit:cover;
 opacity:0;
 transition:0.2s;
}

.previewItem:hover video{
 opacity:1;
}

/* 가격 */
.pricing{
 background:#161a22;
 padding:50px;
 border-radius:16px;
 text-align:center;
}
.price{
 font-size:60px;
 color:#ff3b3b;
 font-weight:800;
}

/* 반응형 */
@media(max-width:900px){
 .hero{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr}
 .previewGrid{grid-template-columns:1fr}
}

.logo{
  display:flex;
  align-items:flex-start;
  margin-bottom:40px;
}

.logo img{
  height:60px;
}
 

 
</style>

      <div style="text-align: left;">

      <div style="display: flex; gap: 12px;">
    <button onclick="window.location.href='https://www.im-stock.com/plan/create/'"
            style="background-color: #ff4d4d; color: white; border: none; padding: 18px 40px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer;">
        지금 구독 시작
    </button>
    
    <button onclick="window.location.href='https://www.im-stock.com'"
            style="background-color: #1e2127; color: white; border: none; padding: 18px 40px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer;">
        콘텐츠 둘러보기
    </button>
</div>

    </div>
  </section>
</div>

<img src="benefits_full.png" alt="혜택 설명 이미지" style="width: 65%; display: block; margin: 60px auto;">

<style>
.previewItem {
  width: 320px;           /* 그리드 너비에 맞춤 */
  overflow: hidden;      /* 넘치는 영상 숨김 */
  border-radius: 8px;    /* 선택 사항: 모서리 둥글게 */
  background: #000;      /* 영상 로딩 전 검은 배경 */
}
display: inline-block; 
    margin: 10px;
}
 .previewItem video {
  width: 100%;           /* 가로를 꽉 채우고 */
  aspect-ratio: 16 / 9;  /* 가로세로 비율을 16:9로 고정 */
  object-fit: cover;     /* 영상이 찌그러지지 않게 꽉 채움 */
  display: block;        /* 하단 미세한 공백 제거 */
} 

.previewGrid {
    display: flex;
    flex-wrap: wrap;          /* 공간이 부족하면 다음 줄로 넘김 */
    justify-content: center;    /* 핵심: 가로 방향 중앙 정렬 */
    gap: 20px;                /* 영상 박스 사이의 간격 */
 max-width: 1040px;         /* (320px * 3개) + (20px * 2개 간격) = 1000px + 여유분 */
    margin: 0 auto;            /* 그리드 전체를 중앙으로 */
}

.previewItem {
    width: calc(33.33% - 20px);             /* 창 크기가 변해도 고정될 너비 */
    flex-shrink: 0;           /* 크기가 강제로 줄어드는 것 방지 */
    overflow: hidden;
    border-radius: 8px;
    background: #000;
}
</style>
 
<section class="section">
  <div class="sectionTitle">콘텐츠 미리보기</div>
  
  <div class="previewItem">
    <video 
        poster="preview1.jpg" 
        muted 
        loop 
        playsinline
        onmouseover="this.play()" 
        onmouseout="this.pause(); this.currentTime=0;">
        <source src="preview2.mp4" type="video/mp4">
    </video>
</div>
    <div class="previewItem">
      <video muted loop autoplay playsinline>
        <source src="preview2.mp4" type="video/mp4">
        Video

    </div>
    <div class="previewItem">
      <video muted loop autoplay playsinline>
        <source src="preview3.mp4" type="video/mp4">

      </video>
    </div>
    <div class="previewItem">
      <video muted loop autoplay playsinline>
        <source src="preview4.mp4" type="video/mp4">
        Video

    </div>
    <div class="previewItem">
      <video muted loop autoplay playsinline>
        <source src="preview5.mp4" type="video/mp4">
        Video
      </video>
    </div>
    <div class="previewItem">
      <video muted loop autoplay playsinline>
        <source src="preview6.mp4" type="video/mp4">
        Video
      </video>
    </div>
  </div>
</section>
